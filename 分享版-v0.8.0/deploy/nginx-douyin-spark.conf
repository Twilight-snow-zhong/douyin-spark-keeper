# 抖音续火花助手 · nginx 反向代理配置
#
# 用法：
#   1) 把 your-domain.com 换成你的真实域名（有两处 server_name）
#   2) 证书那两行：用 certbot 会自动改写；用阿里云证书则改成你自己的 .pem/.key 路径
#   3) 放到 /etc/nginx/conf.d/douyin-spark.conf，然后：nginx -t && systemctl reload nginx
#
# 前置（很重要）：
#   应用要改成只监听 127.0.0.1：/root/douyin-spark/.env 里 HOST=127.0.0.1，再 systemctl restart douyin-spark
#   否则公网仍可直连 :8000 绕过 nginx；程序判断"是否本机"依赖下面 X-Real-IP 这一行，勿删。

# ---------- 80：只用于跳转 HTTPS ----------
# 没有证书时先注释掉下面 443 那段，只留 80 段，用 certbot 签发成功后再启用
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # certbot 的 http-01 校验走这里（必须保留，否则签发/续期会失败）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443：正式入口 ----------
server {
    # http2 写在 listen 后面：兼容 nginx 1.18（Ubuntu 22.04 自带）~1.24
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # 证书（certbot 会自动写入；阿里云证书改成 /etc/nginx/ssl/你的文件名.pem / .key）
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 上传图片（自己的表情图）与备份下载都可能较大；默认 1m 会导致 413
    client_max_body_size 64m;

    # 不要在这里开 basic auth：程序自带访问令牌，双重认证反而麻烦
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # 下面这行是安全相关：程序靠它识别真实客户端 IP，
        # 判断"是否本机"（本机才允许无令牌首次设置访问令牌）。删掉会让公网访客被误判为本机。
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 扫码登录、抓取聊天列表、发送一轮都可能跑很久，超时给足
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # 日志流式返回、长请求更顺
        proxy_buffering off;
    }
}
