# 抖音续火花助手 · nginx 反向代理（路线 B：非标端口 8443 + HTTPS）
#
# 适用：服务器在中国大陆，域名不想/无法备案 → 不能用 80/443（会被备案校验拦截），
#       改用 8443 端口对外提供 HTTPS。证书用阿里云免费证书（DNS 验证，不需要 80 端口）。
#
# 用法：
#   1) 全局替换 your-domain.com 为你自己的域名
#   2) 证书两行改成你上传到 /etc/nginx/ssl/ 的实际文件名
#   3) 放到 /etc/nginx/conf.d/douyin-spark.conf，然后 nginx -t && systemctl reload nginx
#   4) 阿里云安全组放行 TCP 8443（来源 0.0.0.0/0）
#
# 前置：
#   应用只监听 127.0.0.1（deploy.sh 默认已写入 HOST=127.0.0.1）
#   下面 X-Real-IP 那行是安全相关，程序靠它识别真实来源，勿删。

server {
    # 只监听 8443；不要监听 80/443（未备案域名会被拦，配了也没用）
    # 注意：http2 必须写在 listen 后面 —— 兼容 nginx 1.18（Ubuntu 22.04 自带）到 1.24；
    #       nginx 1.25+ 的 `http2 on;` 新语法在 1.18 上会报 unknown directive 导致起不来
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;

    server_name your-domain.com www.your-domain.com;

    # ===== 证书（阿里云免费 SSL 证书，nginx 版）=====
    # 从阿里云「数字证书管理服务」签发后下载 nginx 版，会有 .pem 和 .key 两个文件
    # 上传到 /etc/nginx/ssl/ 后，把下面两行改成实际文件名
    ssl_certificate     /etc/nginx/ssl/your-domain.com.pem;
    ssl_certificate_key /etc/nginx/ssl/your-domain.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 上传自己的表情图、下载备份都可能较大（默认 1m 会 413）
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host:8443;
        # 安全相关：程序靠它判断真实客户端 IP（回环判定用），删掉会让公网访客被误判为本机
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 扫码登录、抓取聊天列表、发送一轮都可能很久，超时给足
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        proxy_buffering off;
    }
}
